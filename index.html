<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>안택스 리포트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: single-column index of internal reports */
:root{--bg:#f4f5f3;--panel:#fff;--line:#dde2de;--fg:#15201c;--fg2:#4b5853;--muted:#7a8681;--accent:#0f6b5c;--accent-soft:#e1eeea;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;--f-num:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#101614;--panel:#18201d;--line:#2a3531;--fg:#e8eeeb;--fg2:#b3beb9;--muted:#85918c;--accent:#4fbfa8;--accent-soft:#1d332d;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:40px 48px;display:grid;gap:14px}
.eyebrow{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:600}
h1{font-size:22px;margin:4px 0 0}
p.sub{margin:0;color:var(--fg2);font-size:13px}
a.card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;text-decoration:none;color:inherit}
a.card:hover{border-color:var(--accent)}
a.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.t{font-weight:700;font-size:15px}
.d{font-size:12px;color:var(--fg2);grid-column:1}
.path{font-family:var(--f-num);font-size:11px;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:999px;grid-row:1/3;grid-column:2}
.soon{opacity:.55;pointer-events:none}
</style></head><body>
<div class="wrap">
  <div><div class="eyebrow">AHNTAX · 사내 리포트</div><h1>안택스 리포트</h1><p class="sub">사내 공유용 성과 리포트 모음입니다. 외부 공유는 삼가 주세요.</p></div>
  <a class="card" href="./insight/"><span class="t">안택스 인사이트 숏폼 리포트</span><span class="d">7개 채널 일일 성과 · 매일 오전 9시 전 업데이트</span><span class="path">/insight</span></a>
</div>
</body></html>
