<style>
/* Layout: mobile-first channel console — sticky date + channel tabs, then one channel at a time: account → today's deltas → algorithm signals → daily trend → per-video cards with comments */
:root{
  --bg:#f4f5f3; --panel:#ffffff; --line:#dde2de; --grid:#eceeeb;
  --fg:#15201c; --fg2:#4b5853; --muted:#7a8681;
  --accent:#0f6b5c; --accent-soft:#e1eeea; --bar:#2a78d6; --up:#1a7f4b; --up-bg:#e3f3ea; --idle:#6c7672; --idle-bg:#eceeec;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101614; --panel:#18201d; --line:#2a3531; --grid:#222b28; --fg:#e8eeeb; --fg2:#b3beb9; --muted:#85918c;
  --accent:#4fbfa8; --accent-soft:#1d332d; --bar:#3987e5; --up:#5cc88f; --up-bg:#17301f; --idle:#98a39e; --idle-bg:#242d2a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101614; --panel:#18201d; --line:#2a3531; --grid:#222b28; --fg:#e8eeeb; --fg2:#b3beb9; --muted:#85918c;
  --accent:#4fbfa8; --accent-soft:#1d332d; --bar:#3987e5; --up:#5cc88f; --up-bg:#17301f; --idle:#98a39e; --idle-bg:#242d2a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 40px;display:grid;gap:14px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:17px;font-weight:700;margin:0;line-height:1.25}
.sub{font-size:12px;color:var(--muted)}
select{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);max-width:48vw}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--fg2);font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px}
.tab .d{font-family:var(--f-num);font-size:11px;font-weight:500;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tab[aria-selected="true"] .d{color:var(--bg);opacity:.75}
.tab:focus-visible,button:focus-visible,a:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:12px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
h2{font-size:14px;font-weight:700;margin:0}
.hint{font-size:11px;color:var(--muted)}
.acct{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.acct .name{font-size:18px;font-weight:700}
.acct .handle{font-size:12px;color:var(--muted)}
.link{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--accent);text-decoration:none;border:1px solid var(--accent);border-radius:6px;padding:5px 10px;white-space:nowrap}
.link:hover{background:var(--accent-soft)}
.acct-stats{display:flex;gap:18px;flex-wrap:wrap}
.acct-stats div{display:grid}
.acct-stats b{font-family:var(--f-num);font-size:20px;font-weight:600}
.lbl{font-size:11px;color:var(--muted);letter-spacing:.02em}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}

.chart svg{width:100%;height:auto;display:block}
.video{display:grid;gap:10px}
.v-h{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:start}
.v-no{font-family:var(--f-num);font-size:11px;font-weight:600;color:var(--accent)}
.v-title{font-weight:700;font-size:14px;line-height:1.35}
.v-meta{font-size:11px;color:var(--muted);grid-column:1/-1}
.pill{display:inline-block;font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--up-bg);color:var(--up);margin-left:4px;vertical-align:1px}
details{border-top:1px solid var(--grid);padding-top:8px}
summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--fg2);list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:"펼치기";font-weight:500;color:var(--muted)}
details[open] summary::after{content:"접기"}
.cmts{display:grid;gap:10px;margin-top:10px}
.c{display:grid;gap:2px;font-size:13px}
.c.reply{margin-left:14px;padding-left:10px;border-left:2px solid var(--grid)}
.c .u{font-size:11px;color:var(--muted)}
.c .u b{color:var(--fg2);font-weight:600}
.c .x{white-space:pre-wrap;overflow-wrap:anywhere}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:18px 0}
.more{font:inherit;font-size:13px;font-weight:600;padding:10px;border:1px dashed var(--line);border-radius:8px;background:transparent;color:var(--fg2);cursor:pointer;width:100%}
.note{font-size:12px;color:var(--muted)}
.links{display:flex;gap:8px;flex-wrap:wrap}
.fb{margin-top:10px;background:transparent;border-style:dashed}
.fb details{border-top:none;padding-top:0}
.fb summary{font-size:13px;color:var(--fg)}
.fb-list{display:grid;gap:14px;margin-top:12px}
.fb-i{display:grid;gap:3px}
.fb-i b{font-size:13px}
.fb-i p{margin:0;font-size:13px;color:var(--fg2);white-space:pre-wrap}
.fb-ch{font-size:10px;font-weight:700;color:var(--accent);letter-spacing:.04em}
.aud{display:grid;gap:14px}
.aud-g{display:grid;gap:6px}
.na{font-size:12px;color:var(--muted)}
.split{display:flex;height:12px;border-radius:4px;overflow:hidden;background:var(--grid)}
.sp-a{background:var(--bar)} .sp-b{flex:1;background:var(--grid)}
.split-l{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--fg2);font-family:var(--f-num);flex-wrap:wrap}
.bars{display:grid;gap:6px}
.bar-row{display:grid;grid-template-columns:56px minmax(0,1fr) 48px;gap:8px;align-items:center;font-size:12px}
.bar-row .lab{color:var(--fg2);font-family:var(--f-num)}
.tr-row{grid-template-columns:96px minmax(0,1fr) 48px}.tr-row .lab{font-family:var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s .k{white-space:nowrap}
.bar-row .val{font-family:var(--f-num);text-align:right}
.track{height:10px;background:var(--grid);border-radius:3px}
.fill{height:100%;background:var(--bar);border-radius:0 3px 3px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.ic{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.wk{background:var(--idle-bg);color:var(--idle)}

해놨음\n나만 잘살면되는 마인드들은 뭐가 문제냐 하겠지\n민란이 터져야 알까", "user": "eanilimilinae"}, {"ago": "5일", "likes": 33, "text": "이 전략은 주로 미국의 '스텝업' 제도를 전제로 발전한 모델이므로, 한국 등 상속세 및 자산 과세 제도가 다른 국가에서는 세법상 제약이 크고 그대로 적용하기 어렵습니다.", "user": "te5023_"}, {"ago": "5일", "likes": 13, "text": "• 자본주의. 를 인식하고 있기 때문이다.\n1, 돈은 빚이다.\n2, 소비는 감정이다.\n3, 금융지능은 있는가.", "user": "enjo.y8267"}, {"ago": "3시간", "likes": 3, "text": "그래서 빚도 능력이란게 괜히 나온 말이 아님 ㅋㅋ\n부자들이 빚을 땡기는건 세금을 죽이긴 위한 능력을 발휘하는거~", "user": "muaks09"}, {"ago": "11시간", "likes": 2, "text": "바이 보로우 다이", "user": "sohyuncho88"}, {"ago": "8시간", "likes": 1, "text": "자산과 부채를 함께 보는 관점이 흥미롭습니다.", "user": "nabeya_busanmain"}, {"ago": "2시간", "likes": 1, "text": "그르게 집이 세체인데 돈없어 못 살겠다고 하드라", "user": "hoyesbienbien"}, {"ago": "1일", "likes": 0, "text": "우와 부자는 다릅니다", "user": "dr.minabloom"}, {"ago": "1시간", "likes": 0, "text": "반가워👋👋치니야 스하리\n힘이되는 금융정보 보고 갈께", "user": "pm_bangbang"}, {"ago": "1시간", "likes": 0, "text": "그 정도 부자는 아니지만, 투자를 하면서 알게된 부분이 분명히 있음\n매매나 전세보다 월세를 선호하게 되었음", "user": "1a009871"}, {"ago": "20분", "likes": 0, "text": "Buy - borrow - die 전략 우리나라에서도 법인으로 하면 유효할거 같네요", "user": "richsunsang"}, {"ago": "23분", "likes": 0, "text": "자산을 평생 팔지 않는다.라... 법인으로 취득하면 상속증여세 제약으로부터도 어느정도 자유로워질거 같네요 -", "user": "richsunsang"}, {"ago": "4일", "likes": 5, "text": "그냥 두바이 부동산 ㄱㄱ", "user": "nawon_lee"}, {"ago": "1일", "likes": 0, "text": "반가워👋👋치니야 스하리 힘이되는 금융정보 보고 갈께", "user": "pm_bangbang"}, {"ago": "4일", "likes": 1, "text": "같은 빚인데 누구에게는 도구이고 누구에게는 평생 갚아야할 족쇄가 된다는 것이 참 씁쓸하네….", "user": "young.cha0cha"}, {"ago": "13시간", "likes": 0, "text": "흥미롭다 좋다", "user": "quail.14000908"}, {"ago": "4일", "likes": 1, "text": "일단 바이가 안된다", "user": "1ace2go3"}, {"ago": "1일", "likes": 1, "text": "오늘 정보 부채도 자산으로 보는점에 흥미가 있습니다! 한국 사회에서 적용 가능한지도 궁금 합니다!", "user": "annabell6868"}, {"ago": "3일", "likes": 1, "text": "양도세 두들겨 맞느니 담보대출 이자 내면서 버티는 바이 보로우 다이 전략이 확실히 절세 끝판왕이긴 하지. 다만 저 공식은 자산 가치가 대출이자보다 가파르게 오른다는 전제가 깔려 있어야 가능해.", "user": "ziprajabi"}, {"ago": "6일", "likes": 4, "reply": false, "text" 가 몇년전인데 차라리 그때가 오히려 나았어요 깃발 사라지고 수수료 더 떼구 무료배달료로 바꾸면서 그 배달비 가게에서 강제로 받구..", "user": "koo_jung_min"}], "notes": {"facebook": "댓글 없음", "instagram": "Meta 인사이트 미리보기 댓글 5건 수집(댓글 수 6, 답글 1건은 펼치지 못함)", "threads": "답글 3건 수집", "tiktok": "댓글 없음", "youtube": "댓글 없음"}, "threads": [{"ago": "15시간", "likes": 1, "reply": false, "text": "와 대딘하다^^ 감사합니다👍", "user": "fairchoice0812"}, {"ago": "12시간", "likes": 2, "reply": false, "text": "맞아. 덧븉이면 배민은 비마트 수익이 좋아. 또 배달료를 양쪽에서 받아. 소비자랑 매장. 치킨본사는 체인점수랑 물류. 결국 점주만 죽어", "user": "20th.vitamin"}, {"ago": "10시간", "likes": 0, "reply": false, "text": "그래서 결론이 상위노출 유료광고 수수료라는 말이죠? 너무 안읽히네요..", "user": "ai.rusk"}], "tiktok": [], "updatedAt": "2026-10-15 09:27", "youtube": []}}, "feedback": {"2026-09-29": {"date": "2026-09-29", "items": [{"body": "조회 1만, 답글 8건. 답글 대부분이 반론·경험담(경매 사례, 렌트프리, 가치평가)입니다.\n'공실이면 가치평가에 영향 없나?' 질문은 다음 영상 주제로 바로 쓸 수 있습니다.\n할 일: 이 질문에 본계정으로 답글. 답글이 이어질수록 쓰레드 노출이 늘어납니다.", "channel": "쓰레드", "title": "댓글이 다음 주제를 알려주고 있음"}, {"body": "유입이 검색 54.5%·탐색 45.5%, 쇼츠 피드 유입 0.\n영상 길이 1분 57초가 원인일 가능성이 있습니다. 60초 이하 컷 버전 테스트를 권장합니다.", "channel": "유튜브", "title": "쇼츠 피드에 아직 진입 못함"}, {"body": "페이스북 3초 이상 조회 37.4%.\n다음 영상은 '건물주가 임대료를 1원도 안 깎는 이유'처럼 역설을 첫 문장에 두고, 상황 설명은 뒤로 보내세요.", "channel": "공통", "title": "첫 3초에 역설을 먼저"}, {"body": "저장 37·공유 20으로 반응은 가장 좋지만 프로필 링크 클릭으로 이어지지 않습니다.\n고정 댓글로 프로필 링크를 안내하세요.", "channel": "인스타그램", "title": "전환 동선 비어 있음"}, {"body": "공개 상태인데 조회 0. 앱에서 영상 소리가 나오는지, '검토 중' 표시가 있는지 확인하세요. 1분 넘는 영상은 사운드 제한으로 음소거될 수 있습니다.", "channel": "틱톡", "title": "조회 0 원인부터 확인"}]}, "2026-09-30": {"date": "2026-09-30", "items": [{"body": "#02 유입의 97.4%가 쇼츠 피드이고 조회 1,212회입니다. #01은 검색 76.9%로 피드에 들어가지 못했습니다. 다만 시청 vs 스와이프 49.3%로 절반이 넘깁니다.\n할 일: 다음 영상도 첫 문장에 숫자 역설을 두고, 첫 2초 자막을 더 크게 씁니다.", "channel": "유튜브", "title": "#02가 쇼츠 피드에 진입"}, {"body": "#02 저장 68, 좋아요 43. 도달 대비 저장 0.95%로 #01(0.47%)의 2배입니다. 법인세·감가상각 같은 '나중에 다시 볼 정보'가 먹힙니다.\n할 일: 캡션 끝에 '저장해 두고 결산 때 확인하세요' 한 줄을 넣습니다.", "channel": "인스타그램", "title": "저장이 좋아요를 앞섬"}, {"body": "#01 팔로우 86, #02 72. 계정 팔로워가 59명에서 146명이 됐습니다. 비팔로워 조회가 99% 이상이라 추천 노출에서 들어오고 있습니다.\n할 일: 프로필 첫 줄에 채널 주제(세금·자산 인사이트)를 명확히 적습니다.", "channel": "인스타그램", "title": "팔로우 전환이 강함"}, {"body": "두 영상 모두 대부분이 0:05에서 이탈합니다. #02 조회는 180회로 #01(9,858회)의 2% 수준입니다. 시청자 45~64세 남성 비중이 높습니다.\n할 일: 페이스북용은 첫 화면에 결론 숫자('매출 1,000억, 법인세 0원')를 크게 띄웁니다.", "channel": "페이스북", "title": "5초 이탈 반복, #02는 노출 자체가 적음"}, {"body": "스튜디오 기준 공개 설정 '모두'인데 조회 0입니다. 1분 45초 이상 길이, 계정 신규 상태가 원인일 수 있습니다.\n할 일: 60초 이하 컷 버전을 한 편 올려 초기 노출 여부를 확인합니다.", "channel": "틱톡", "title": "두 영상 모두 조회 0"}]}, "2026-10-01": {"date": "2026-10-01", "items": [{"body": "#01·#02는 조회 1에 머물렀는데 #03은 242회, 좋아요 10, 새 팔로워 2입니다. 유입의 97.7%가 추천 피드입니다. 다만 대부분 0:02에서 이탈합니다.\n할 일: 틱톡용은 첫 1초에 '사상 최대 매출인데 하한가' 같은 결론 자막을 크게 넣습니다.", "channel": "틱톡", "title": "#03으로 틱톡 첫 노출"}, {"body": "#03 조회 1,181회 중 계속 시청 18.5%로, #02(49.4%)보다 크게 낮습니다. 길이도 2분 19초로 가장 깁니다.\n할 일: 다음 영상은 1분 30초 이내로 줄이고 도입 설명을 압축합니다.", "channel": "유튜브", "title": "#03은 피드 노출은 되지만 대부분 넘김"}, {"body": "#02는 하루 새 저장 68→89, 팔로우 72→102입니다. 계정 팔로워는 146명에서 185명이 됐습니다.\n할 일: 저장이 많은 세금 실무형 주제(법인세·감가상각)를 다음 주 기획에 한 편 더 넣습니다.", "channel": "인스타그램", "title": "#02 저장·팔로우가 계속 늘어남"}, {"body": "#03 페이스북 조회 141회, 평균 시청 5초로 세 영상 중 가장 짧습니다. 주식 주제는 페이스북 시청층(45~64세 남성)에서 반응이 약합니다.\n할 일: 페이스북은 부동산·세금 주제를 우선 게시합니다.", "channel": "페이스북", "title": "#03 평균 시청 5초"}, {"body": "오늘 8:45 예약 수집은 PC가 꺼져 있어 실행되지 않았고 수동으로 수집했습니다.\n할 일: 수집 시간에 PC와 크롬(ahntax7)을 켜 둡니다.", "channel": "공통", "title": "수집 루틴 실행 조건"}]}, "2026-10-02": {"date": "2026-10-02", "items": [{"body": "게시 첫날 조회 4,140회, 저장 30, 팔로우 28입니다. 여성 비중이 33.9%로 기존 영상(12~16%)의 두 배 이상이고 댓글 5건이 모두 공감·질문형입니다. 그래서 자영업 생활 밀착 주제를 주 1회 이상 편성하고, '가격을 올리면 손님이 안 오나' 같은 댓글 질문을 다음 편 소재로 씁니다.", "channel": "인스타그램", "title": "#04 맛집 폐업 편, 첫날 4,140회로 순항"}, {"body": "#04가 하루 만에 802회(추천 99.7%), 팔로워 2→5명입니다. 다만 대부분 0:02에서 이탈하고 완주율 5.2%입니다. 그래서 첫 2초 안에 결론형 자막(예: '줄 서는 맛집이 망하는 이유는 원가율')을 넣은 버전을 다음 업로드에서 시험합니다.", "channel": "틱톡", "title": "틱톡이 처음으로 하루 800회를 넘겼습니다"}, {"body": "#04는 624회, 평균 1:39/2:36(63.5%), 구독 +2로 #03(36.0%)보다 시청 유지가 훨씬 좋습니다. 반면 '계속 시청함'은 35.7%로 스와이프 비중이 큽니다. 그래서 썸네일 첫 프레임과 첫 문장을 #04 형식(장면+숫자)으로 통일합니다.", "channel": "유튜브", "title": "#04 평균 시청 63.5%, #03보다 크게 개선"}, {"body": "#04는 248회, 3초 이상 조회 82회, 대부분 0:08에서 이탈했고 시청자 93.9%가 남성·45-54세 36.8%입니다. #01을 제외하면 페이스북 조회가 250회 이하에 머뭅니다. 그래서 페이스북은 릴스 캡션 첫 줄을 질문형으로 바꿔 3초 이후 유지율을 먼저 확인합니다.", "channel": "페이스북", "title": "페이스북은 평균 시청 14초, 0:08 이탈"}, {"body": "인스타 185→224명(+39), 유튜브 1→3, 틱톡 2→5, 쓰레드 12→14로 모든 채널 팔로워가 늘었습니다. 지난 영상(#01~#03)의 추가 조회는 인스타를 빼면 거의 없어 신규 업로드가 성장의 대부분을 만듭니다. 그래서 1일 1업로드 18시 일정을 지키는 것을 최우선으로 둡니다.", "channel": "공통", "title": "인스타 팔로워 하루 +39명, 신규 영상 효과"}]}, "2026-10-03": {"date": "2026-10-03", "items": [{"body": "#04 조회가 4,140→6,105회로 하루 새 1,965회 늘었고 팔로우 60, 저장 49를 기록했다. 같은 D+1 시점 #02(9,360회)보다는 낮지만 팔로우 전환은 비슷한 흐름이다. 자영업 공감 댓글이 9건으로 가장 많다. 그래서: 자영업자 대상 주제를 다음 주 편성에 1편 더 넣는다.", "channel": "인스타그램", "title": "#04 맛집 폐업편, 게시 이틀째에도 성장 중"}, {"body": "#05는 게시 약 18시간 만에 1,461회, 평균 시청 63초로 #04(76초)와 비슷하다. 다만 댓글 0, 공유 4로 반응은 아직 적다. 그래서: 캡션 끝에 '내 통장 돈은 진짜일까?' 같은 질문을 고정 댓글로 달아 댓글을 유도한다.", "channel": "인스타그램", "title": "#05 은행편 첫 18시간 1,461회, 시청 시간은 양호"}, {"body": "#05 평균 시청 7초, #03 5초로 #01(22초)보다 크게 짧고, 3초 이상 조회도 #05 194회 중 41회(21%)뿐이다. 하루 전체 조회 증가도 232회에 그쳤다. 그래서: 페이스북 업로드는 첫 화면 자막에 핵심 숫자를 크게 띄운 버전으로 시험해 본다.", "channel": "페이스북", "title": "초반 이탈이 심해 평균 시청 5~7초에 머묾"}, {"body": "#04(10개 타래)는 하루 새 757→996회로 늘었지만 좋아요 2, #05(9개 타래)는 18시간 169회에 좋아요 0이다. 반면 단일 글이던 #01은 좋아요 19, 댓글 8이었다. 그래서: 다음 게시는 타래를 3개 이내로 줄이고 첫 글에 결론 한 줄을 넣는다.", "channel": "쓰레드", "title": "긴 타래형 글은 조회는 늘지만 좋아요가 거의 없음"}, {"body": "#05는 18시간 134회, 완주율 4.2%로 낮고 #04(817회)·#03(258회)도 대부분 0:02에서 이탈했다. 시청자는 55세 이상이 #05 53%, #03 63%다. 그래서: 틱톡은 첫 2초에 질문 자막을 넣은 컷 편집본을 1편 시험한다.", "channel": "틱톡", "title": "0:02 이탈이 계속되고 55세 이상 비중이 높음"}]}, "2026-10-04": {"date": "2026-10-04", "items": [{"body": "#06은 게시 12~15시간 만에 인스타 81,475·틱톡 7.1만·쓰레드 4.1만 조회로 기존 최고(#01, 5일 누적)를 모든 주요 채널에서 넘었다. 팔로워는 인스타 268→1,878, 틱톡 6→942, 쓰레드 14→223, 유튜브 4→50으로 하루 만에 늘었다. 그래서 '부자의 합법적 자산 구조'(대출·법인·상속) 앵글의 후속편을 다음 업로드 순서 앞쪽에 배치한다.", "channel": "공통", "title": "#06 '부자들이 빚을…' 단일 영상이 계정 전체를 키웠다"}, {"body": "#06은 조회 대비 저장 1.9%, 공유 0.8%로 #01(저장 0.5%)보다 저장 비율이 약 3.5배 높다. 유입의 99.2%가 비팔로워이고 연령은 35~54세가 66%다. 그래서 신규 팔로워가 이어 볼 수 있도록 프로필 상단에 #06과 관련 영상을 고정하고, 캡션에 핵심 구조를 한 줄 요약해 저장 동기를 유지한다.", "channel": "인스타그램", "title": "#06 저장 1,514·팔로우 1,413, 비팔로워 99.2%"}, {"body": "#06이 추천 피드로 7.1만 조회를 낸 뒤 #01~#05는 하루 새 +242~+530 조회가 늘었고 트래픽의 57~100%가 개인 프로필 경로다. 다만 모든 영상이 0:01~0:02 지점에서 대부분 이탈한다. 그래서 #06을 프로필 고정하고, 다음 영상은 첫 2초에 #06처럼 구체 금액(1,000억)을 바로 보여주는 장면으로 시작한다.", "channel": "틱톡", "title": "#06 추천 99.8% → 기존 영상은 프로필 경유로 재조회"}, {"body": "#06은 게시 약 12시간 만에 조회 4.1만, 공유 403으로 쓰레드 최고 기록이다. 답글 중 '미국 스텝업 제도 전제라 한국 세법에선 그대로 적용하기 어렵다'는 의견이 좋아요 15로 가장 많은 공감을 받았다. 그래서 국내 상속세·양도세와의 차이를 짧게 정리한 보충 답글을 본인 계정으로 달아 정보의 정확성을 보완한다.", "channel": "쓰레드", "title": "공유 403·리포스트 51, '한국엔 그대로 적용 어렵다' 답글이 최다 좋아요"}, {"body": "유튜브 #06은 게시 약 15시간 만에 1,521 조회, 평균 시청 1:58/2:08(92%), 쇼츠 피드 94.8%로 구독자 +35를 만들었다. 같은 시간 페이스북 #06은 35회, 평균 21초로 확산이 거의 없다. 그래서 유튜브는 같은 앵글 후속을 쇼츠로 이어 가고, 페이스북은 인사이트 반영 지연 여부를 내일 다시 확인한 뒤 판단한다.", "channel": "유튜브", "title": "#06 평균 시청 92%·구독 +35, 페이스북은 35회에 그쳐"}]}, "2026-10-05": {"date": "2026-10-05", "items": [{"body": "#06은 하루 사이 인스타 +24.8만(누적 33.0만), 틱톡 +5만(12.1만), 쓰레드 +3.1만(7.2만) 조회가 늘었다. 팔로워도 인스타 1,878→6,186, 틱톡 942→1,830, 유튜브 50→97로 뛰었다. 쓰레드 댓글에 '한국에서는 상속·증여에 어떻게 적용되나'는 질문이 반복된다. 그래서 다음 제작 순위 1번은 #06 후속(부채와 상속·증여 계산)으로 잡는다.", "channel": "공통", "title": "#06 빚 활용 편, 3일차에도 확산 지속"}, {"body": "#07은 게시 약 13시간에 조회 3.9만, 저장 591, 팔로우 485를 기록했다. #06 같은 시점(약 12시간, 8.1만) 대비 조회는 절반이지만 저장률은 1.5%로 높은 편이다. 댓글은 '법인 돈은 못 뺀다', '횡령 위험' 같은 반론이 중심이다. 그래서 대표 급여·배당 등 법인 자금 인출 구조를 짧게 정리한 고정 댓글을 단다(단정·보장 표현은 피한다).", "channel": "인스타그램", "title": "#07 법인 편, 저장 많지만 반론 댓글도 많음"}, {"body": "#07 틱톡은 34K 조회에 평균 시청 48초(영상 2분 55초), 완주 5.2%로 #06(8.7%)보다 낮다. 7편 모두 대부분 0:02 전후에서 이탈한다. 여성 비중은 37%로 인스타(20%)보다 높다. 그래서 다음 편부터 첫 화면에 핵심 숫자 대비(예: 같은 12억, 다른 세후 금액)를 자막으로 바로 띄운다.", "channel": "틱톡", "title": "완주율이 낮다, 첫 2초를 고친다"}, {"body": "#07은 게시 약 15시간에 조회 1,311, 구독 +23, 쇼츠 피드 유입 93.8%, 평균 시청 72.6%다. 반면 #03(주식 편)은 평균 시청 43%, 계속 시청 20.4%로 가장 약하다. 그래서 신규 편은 #07처럼 2분대 후반 길이를 유지하되, #03 같은 도입부는 재편집 후보로 둔다.", "channel": "유튜브", "title": "쇼츠 피드 노출이 붙기 시작"}, {"body": "페이스북 릴스 목록에 #07이 없다. 전체 페이스북 조회 증가는 하루 +32에 그쳤다. 그래서 인스타→페이스북 교차게시 설정을 확인하고 #07을 수동 게시할지 결정한다.", "channel": "페이스북", "title": "#07 페이스북 미게시"}]}, "2026-10-06": {"date": "2026-10-06", "items": [{"body": "#08은 게시 14시간에 조회 4,818회, 비팔로워 비중 26.7%입니다. 같은 시점 #07은 3.9만 회·비팔로워 91%였습니다. 첫 3초 이탈이 아니라 추천 진입이 늦은 상태로 봅니다. 오늘 저녁 업로드 전 #08을 스토리로 한 번 더 노출해 초기 반응(저장·공유)을 끌어올립니다.", "channel": "인스타그램", "title": "#08은 아직 팔로워 안에서만 돌고 있다"}, {"body": "#08 쓰레드는 13시간 만에 조회 2.0만 회, 공유 28회로 #06(첫날 수천 회대)보다 빠릅니다. 팔로워도 376명→413명(+37)입니다. '회사는 망했는데 대표는' 같은 대비형 첫 줄이 쓰레드에서 먹힙니다. 다음 원고 첫 줄도 '결과 vs 반전' 대비 구조로 씁니다.", "channel": "쓰레드", "title": "#08 쓰레드가 이번 주 최고 출발"}, {"body": "틱톡 하루 조회 증가 약 7.3만 회 중 #08이 3.9만(게시 15시간), #07이 +1.8만, #06이 +1.5만입니다. 세 영상 모두 추천 비중 99% 이상, 팔로워는 1,830명→2,480명(+650)입니다. 다만 대부분 0:02에서 이탈하고 완주율은 5~9%입니다. 첫 2초 자막에 숫자(5,000억·12억)를 바로 띄우는 편집을 유지·강화합니다.", "channel": "틱톡", "title": "추천 피드가 하루 단위로 확실히 붙는다"}, {"body": "#08은 게시 15시간에 1,458회, 쇼츠 피드 97.9%, 계속 시청함 70.0%, 평균 1:32/2:29(61.7%)로 구독 +8입니다. 반면 #06·#07은 하루 증가가 각각 +28, +30회로 피드 노출이 거의 끝났습니다. 유튜브는 첫날 성과가 전부이므로 18시 정시 업로드와 고정 댓글(질문형)을 매번 붙입니다.", "channel": "유튜브", "title": "#08 쇼츠 피드 진입, 유지율도 양호"}, {"body": "#07·#08 댓글에서 '법인 돈은 대표 돈이 아니다', '대표가 연대보증 서면 소용없다'는 지적이 인스타·유튜브·틱톡에 공통으로 나왔습니다(신규 댓글 23건 수집). 반론이 많다는 건 관심이 높다는 뜻입니다. 후속편으로 '가지급금·연대보증의 현실'을 과장 없이 다루고, 영상 내 '예외 조건' 한 줄을 넣습니다.", "channel": "공통", "title": "댓글은 '법인=대표 돈 아님' 반론이 반복"}]}, "2026-10-07": {"date": "2026-10-07", "items": [{"body": "게시 약 16시간 시점 #09는 인스타 8,993·틱톡 7,992·쓰레드 3,700회. 전날 같은 시점(약 14~15시간)의 #08은 인스타 4,818·틱톡 39,000·쓰레드 20,000회였다. 인스타는 2배 가까이 빠르지만 틱톡은 5분의 1 수준이고, 틱톡 대부분이 0:02에서 이탈했다. 그래서 다음 영상은 틱톡용 첫 2초 자막을 '숫자+손해' 문장으로 따로 시험한다.", "channel": "공통", "title": "#09 연봉 1달러, 인스타는 빠르고 틱톡·쓰레드는 느리다"}, {"body": "계정 팔로워 8,461→9,828(+1,367). 같은 기간 #06 조회 +71,386(누적 49.9만, 팔로우 7,789), #07 +13,445(누적 10.6만, 팔로우 1,415). 두 영상 모두 비팔로워 조회 비중이 각각 99.0%·93.8%다. 그래서 #06·#07을 프로필 상단에 고정해 새로 들어온 사람이 다음 영상으로 이어지게 한다.", "channel": "인스타그램", "title": "#06·#07이 팔로워를 끌어올리는 중"}, {"body": "#08 조회 2.0만→3.7만(+17,000), 답글 10·리포스트 13. 연대보증·과점주주 2차 납세의무를 짚는 반론이 이어졌고 작성자 답글이 대화를 붙잡았다. 그래서 다음 원고에 '예외 조건' 블록을 미리 넣고, 쓰레드에는 반론이 나올 지점을 질문으로 던진다.", "channel": "쓰레드", "title": "#08 반론 댓글이 조회를 키웠다"}, {"body": "틱톡 팔로워 2,480→2,785(+305). 하루 조회 증가는 #08 +10,000, #06 +6,000, #07 +3,000. #01~#05는 트래픽의 76~99%가 개인 프로필에서 나오고 완주율 10~19%로 신작(5~9%)보다 높다. 그래서 프로필 고정 영상 3개를 #06·#07·#08로 맞춰 첫 방문자 동선을 정리한다.", "channel": "틱톡", "title": "팔로워 +305, 구작은 프로필 유입으로 돈다"}, {"body": "구독자 114→127(+13). #07은 최근 48시간 유입의 39%가 검색, #08은 쇼츠 피드 96.6%·계속 시청 70.5%로 피드 반응이 가장 좋다. #03은 계속 시청 21%로 가장 낮다. 그래서 제목에 '종합소득세·법인 전환' 같은 검색어를 앞쪽에 두고, #03 유형(주식 이슈)은 도입부를 더 짧게 만든다.", "channel": "유튜브", "title": "구독 +13, 검색 유입은 #07이 가장 크다"}]}, "2026-10-08": {"date": "2026-10-08", "items": [{"body": "구독자 127→159명(+32), 하루 기준 가장 큰 증가다. #09는 하루 만에 146→1,285회(+1,139, 쇼츠 피드 94.7%), #10은 게시 약 16시간에 1,351회(쇼츠 피드 95.4%)로 같은 시점 #09(146회)의 9배다. 두 영상 모두 계속 시청 66%대로 #08(70.7%)에 가깝다. 그래서 #09·#10의 첫 장면 구성(인물+숫자 질문)을 다음 편에도 그대로 유지한다.", "channel": "유튜브", "title": "#09·#10이 쇼츠 피드에 연달아 올라탔다"}, {"body": "#10은 게시 약 16시간에 8,900회로 #09 같은 시점(3,700회)의 2.4배지만 좋아요 19, 답글 0이다. 답글 10건이 붙은 #08은 하루 만에 3.7만 회까지 갔다. 그래서 #10에 '특허 소송, 막을 방법이 있을까요?' 같은 질문을 본인 답글로 달아 대화를 먼저 연다.", "channel": "쓰레드", "title": "#10 조회는 빠른데 답글이 0"}, {"body": "프로필 팔로워가 9,828명에서 '1만' 표기로 바뀌었다. 하루 조회 증가는 #06 +37,446(누적 53.7만), #07 +8,603, #09 +7,728(게시 2일차) 순이다. #10은 16시간 6,906회로 #09 같은 시점(8,993회)보다 약간 느리고 남성 비중이 86.1%로 높다. 그래서 1만 달성 기념 고정 게시물이나 스토리로 프로필 방문자를 #06·#07로 연결한다.", "channel": "인스타그램", "title": "팔로워 1만 도달, 확산은 #06·#07·#09가 이끈다"}, {"body": "틱톡 팔로워 2,785→2,998명(+213), 하루 조회 증가 21,387회(#06 +7,000, #10 6,743, #09 +4,008). #10은 55세 이상이 43%로 지금까지 영상 중 가장 높고 완주율은 6.0%다. 댓글은 '악의축', '텍사스주가 뒷돈' 등 특허 소송 구조에 대한 반감이 많다. 그래서 다음 편은 중장년층이 바로 체감하는 생활·자산 주제를 앞세우고, 첫 2초 자막 실험을 이어 간다.", "channel": "틱톡", "title": "신작 초반 조회는 비슷, 55세 이상 비중이 더 높아졌다"}, {"body": "게시 약 16시간 시점 #10은 쓰레드(8,900회)와 유튜브(1,351회)에서 #09보다 빠르고, 인스타(6,906회)·틱톡(6,743회)에서는 조금 느리다. 페이스북은 247회로 #09(176회)보다 높지만 여전히 대부분 0:08 이전에 이탈한다. 그래서 같은 영상이라도 쓰레드·유튜브용 제목은 '특허 괴물' 같은 키워드를 앞에 두고, 인스타·틱톡은 금액 숫자를 앞에 둔다.", "channel": "공통", "title": "#10 특허 편, 채널별 반응이 갈렸다"}, {"body": "인스타 최근 30일 조회 71.9만 → 프로필 방문 1.1만(1.5%) → 팔로우 약 1만(방문의 약 90%) → 외부 링크 누름 51(방문의 0.5%). 쓰레드 #10은 조회 11,156 → 프로필 방문 147(1.3%) → 팔로우 10(6.8%), 틱톡은 최근 7일 조회 27.6만 → 프로필 조회 3.2천(1.2%)이다. 프로필 방문과 팔로우는 잘 되지만 홈페이지로 넘어가는 비율이 가장 약하다. 하루 수치는 건수가 작아 흔들리므로 최근 7일 기준으로 본다. 그래서: 프로필 방문률·팔로우 전환율·링크 클릭률 3개를 매주 월요일에 점검하고, 첫 조치로 인스타 소개란 링크 문구를 상담·문의 중심으로 바꾼다. 틱톡은 소개란 주소가 눌리지 않으니 웹사이트 링크 등록이 가능한지 확인한다.", "channel": "공통", "title": "유입 효율 3지표, 주 1회 점검"}]}, "2026-10-09": {"date": "2026-10-09", "items": [{"body": "게시 약 15시간 만에 조회 30,255회, 팔로우 99, 저장 148. 같은 경과 시간대 #10(약 16시간, 6,906회)의 4.4배다. 비팔로워 조회 비중 87%로 추천 노출이 크게 붙었다. 그래서: 주식·기업재무 주제를 다음 주 편성에 1~2편 더 넣는다.", "channel": "인스타그램", "title": "#11 첫날 3만 회, 같은 시점 #10의 4.4배"}, {"body": "인스타 시청자 댓글 5건 중 2건이 '현금이 아니라 주식을 태우는 것', '말장난'이라고 지적했다. 자사주 소각은 회사가 사들인 자기 주식을 없애는 것이다. 그래서: 고정 댓글로 개념을 한 줄 보충하고, 비유형 제목은 영상 첫 10초 안에 실제 의미를 밝힌다.", "channel": "공통", "title": "#11 제목 비유에 정확성 지적 댓글"}, {"body": "게시 약 15시간 조회 1,551회로 같은 경과 시간대 #10(6,743회)의 23% 수준이다. 완주율 5.6%, 대부분 0:02에서 이탈했다. 그래서: 다음 편은 첫 2초 화면 문구를 숫자·질문형으로 바꿔 비교한다.", "channel": "틱톡", "title": "#11 틱톡 초반 노출 부진"}, {"body": "#11 '계속 시청함' 81.7%로 11편 중 가장 높지만 조회는 180회(약 16시간)다. 하루 증가분은 #09 +170, #10 +105로 2~3일 차에 노출이 붙는 흐름이다. 그래서: #11은 하루 더 지켜보고, 제목 앞부분에 '자사주 소각' 검색어를 둔다.", "channel": "유튜브", "title": "#11 유지율은 최고, 노출은 아직 낮음"}, {"body": "#10 조회가 8.9천에서 1.2만(반올림 표기)으로 늘었고 공유 11건이다. 쓰레드는 게시 2일 차에 조회가 늦게 붙는 경우가 있다. 그래서: #11(1.5천)도 내일까지 추이를 보고, 캡션 첫 줄 질문형 문장을 유지한다.", "channel": "쓰레드", "title": "#10 하루 새 +3,100회"}]}, "2026-10-10": {"date": "2026-10-10", "items": [{"body": "#12는 게시 약 15시간에 조회 106,137회·팔로우 667명입니다. 같은 경과 시간의 #11(30,255회·팔로우 99명)보다 조회 약 3.5배, 팔로우 약 6.7배입니다. 공유 782·저장 611, 비팔로워 조회 94%로 외부 확산이 컸습니다. 그래서: '매일 쓰는 소비 → 숨은 수익 구조' 앵글을 다음 주제 선정에 우선 적용합니다.", "channel": "인스타그램", "title": "커피 프랜차이즈편, 15시간 만에 10.6만 조회"}, {"body": "#12 인스타 댓글 626건 중 상당수는 한 계정의 자음 반복 댓글입니다. 실제 댓글은 프랜차이즈 구조 찬반 토론과 '쿠팡·하이닉스 미국 상장' 같은 주제 요청이 중심입니다. 그래서: 스팸 계정은 제한 처리하고, 요청 주제는 목록으로 모아 오늘 18시 쿠팡편 고정 댓글에서 '요청 반영'을 알립니다.", "channel": "공통", "title": "댓글 626건, 스팸 정리와 요청 주제 수집 필요"}, {"body": "#11 조회가 하루 사이 180→1,379회(+1,199)로 늘었고, #12도 15시간에 1,462회입니다. 두 영상 모두 Shorts 피드 비중 93~96%입니다. 채널 구독자는 170→217명입니다. 계속 시청함 비율은 #11 73.9%, #12 65.0%입니다. 그래서: 첫 2초 훅 구조를 유지하고 18시 업로드 시간을 고정합니다.", "channel": "유튜브", "title": "Shorts 피드 유입 회복, 구독자 하루 +47"}, {"body": "#12는 15시간에 1,469회로, 같은 경과의 #11(1,551회)과 비슷합니다. 전 영상에서 '대부분 0:02 이탈'이 반복되고 #12 완주율은 6.8%입니다. 계정 팔로워는 3.1K→3.2K입니다. 그래서: 틱톡용 첫 화면에 결론형 텍스트 자막을 넣은 버전을 1회 테스트합니다.", "channel": "틱톡", "title": "0:02 이탈 반복, 신규 영상 초반 정체"}, {"body": "쓰레드 #12는 15시간에 조회 404회로 같은 경과의 #11(1,500회)보다 낮고, 기존 게시물 조회는 대부분 변동이 없습니다. 반면 페이스북 #12는 5,268회(비팔로워 5,188회)로 45-54세 37%·35-44세 36%가 주로 봤습니다. 그래서: 쓰레드 본문 첫 줄을 질문형 한 문장으로 바꿔 반응을 비교합니다.", "channel": "쓰레드", "title": "쓰레드 신규 반응 저조, 페이스북은 #12만 확산"}]}, "2026-10-11": {"date": "2026-10-11", "items": [{"body": "게시 약 16시간 기준 #13은 틱톡 2.1만·쓰레드 8,500·인스타 30,593회다. 비슷한 경과 시간(약 15시간)의 #12는 틱톡 1,469·쓰레드 404회였다. 실명 기업 + '적자인데 1위' 같은 역설형 제목이 세 채널에서 동시에 통했다. 그래서: 다음 주 편성에 실명 기업 역설형 주제를 1~2편 배치한다.", "channel": "공통", "title": "#13 쿠팡편, 초반 확산이 전작보다 빠르다"}, {"body": "#12 누적 169,907회(D+1 하루 +63,770)로 #06 다음 규모다. 조회의 94.6%가 비팔로워이고 공유 1,469·저장 1,094건이다. 댓글 642건 중 다수는 한 계정의 자음 반복 스팸이다. 그래서: 해당 계정을 제한 처리하고 고정 댓글로 실제 질문을 유도한다.", "channel": "인스타그램", "title": "#12 커피편 하루 +63,770회, 비팔로워가 끌었다"}, {"body": "#13 조회 중 팔로워 비중 19.4%(5,937/30,549)로 #12의 5.4%보다 높다. 계정 팔로워 표기는 1.3만→1.5만이다. 새로 유입된 팔로워가 다음 영상의 초반 조회를 받쳐주기 시작했다. 그래서: 게시 직후 1시간 스토리 공유로 팔로워 도달을 한 번 더 확보한다.", "channel": "인스타그램", "title": "팔로워 조회 비중이 올라가고 있다"}, {"body": "#13 댓글에서 쿠팡 정산 주기·입점업체 부담 이야기가 반복된다(인스타 nal_laa_ 좋아요 16, 쓰레드 bluelight26e, 틱톡 user99073169260263 등). 시청자가 '돈이 머무는 시간'에 관심이 크다는 신호다. 그래서: 플랫폼 정산 주기와 운전자본을 다루는 후속편을 기획한다(특정 기업 비난·단정 표현은 피한다).", "channel": "공통", "title": "댓글이 '정산 60일' 구조에 몰렸다"}, {"body": "영상별 하루 증가는 최대 #09 +132·#11 +101회이고 나머지는 한 자릿수~수십 회다. 채널 구독자는 217→231명(+14)이다. #13은 Shorts 피드 비중 95.8%, 평균 시청 2:02/2:24(84.7%)로 시청 유지는 양호하다. 그래서: 노출 구간인 첫 2초 훅과 제목을 유튜브용으로 따로 다듬는다.", "channel": "유튜브", "title": "유튜브는 하루 증가폭이 작다"}]}, "2026-10-12": {"date": "2026-10-12", "items": [{"body": "10/11 업로드분은 내부 검토로 내렸다가 재업로드 예정이라 오늘 신규 영상은 없습니다. 월요일이라 15일 이상 지난 영상까지 13편 전체를 다시 집계했습니다. 그래서 오늘은 기존 영상 중 성장세가 이어지는 주제를 다음 기획에 반영하는 데 집중합니다.", "channel": "공통", "title": "신규 영상 없음, 기존 13편 전체 재집계(월요일)"}, {"body": "#12 커피 편은 게시 약 63시간 만에 200,629회(+30,722)로, 조회의 95%가 비팔로워입니다. #13 쿠팡 편은 약 39시간에 53,047회(+22,454), 팔로우 613명입니다. 계정 팔로워는 1.5만→1.6만입니다. 그래서 '일상에서 쓰는 브랜드의 돈 구조'를 다루는 후속 주제를 우선 배치합니다.", "channel": "인스타그램", "title": "커피 프랜차이즈 편이 20만 회 돌파, 쿠팡 편도 하루 +2.2만"}, {"body": "다른 릴스는 100~300회 수준인데 #12는 23,819회(+14,752)로 혼자 튀었습니다. 다만 페이지 팔로워 증가에는 10/11 업로드 후 내린 영상의 일시 노출이 섞였을 수 있습니다. 그래서 #12의 첫 문장 구조를 다음 페이스북 캡션에 그대로 시험합니다.", "channel": "페이스북", "title": "#12 릴스가 하루 만에 2.4만 회, 페이지 팔로워 21→115"}, {"body": "#13 쿠팡 편은 28K(+7K), 새 팔로워 172명, 완주율 9.6%입니다. 시청자는 45~54세 46%, 55세 이상 31%로 중장년 비중이 높습니다. 그래서 첫 2초 자막에 숫자(적자 규모 등)를 먼저 띄우는 훅을 다음 영상에 적용합니다.", "channel": "틱톡", "title": "#13 2.8만 회, 대부분 0:02 이탈"}, {"body": "#11 자사주 편은 2,817회(+1,337)로 Shorts 피드 비중이 95.8%입니다. 업로드 7일 이상 지난 영상은 채널 페이지·검색 유입이 절반 이상입니다. 그래서 주식·재테크 키워드를 제목 앞쪽에 두고, 채널 홈 재생목록을 주제별로 정리합니다.", "channel": "유튜브", "title": "자사주 편 하루 +1,337회, 구독자 231→280"}]}, "2026-10-13": {"date": "2026-10-13", "items": [{"body": "#14(구글·네이버 데이터 경매)는 게시 약 15시간 기준 인스타 7,538·틱톡 336·쓰레드 453·유튜브 246회. #13(쿠팡)은 비슷한 시점(약 16시간)에 인스타 30,593·틱톡 2.1만·쓰레드 8,500회였다. 주제보다 첫 장면에서 밀린 것으로 보인다. 그래서: 다음 영상은 첫 2초에 구체적 숫자·손실을 먼저 보여주는 훅으로 시작한다.", "channel": "공통", "title": "#14 초반 확산이 #13보다 크게 약함"}, {"body": "#14 조회 중 비팔로워 63.9%(4,783/7,481), 평균 시청 33초. #13은 같은 시점 비팔로워 80.6%, 현재 평균 시청 74초. 추천 피드 노출이 덜 붙은 상태다. 그래서: 오늘 중 #14 커버·첫 자막 문구를 더 직접적인 질문형으로 바꿔볼지 검토한다.", "channel": "인스타그램", "title": "#14 비팔로워 도달 비중 낮음"}, {"body": "#12(저가 커피) 200,629→210,400회(+9,771), 팔로우 누적 1,818. #06(부의 세습) 685,631→711,124회(+25,493). 게시 4~10일이 지나도 하루 1만~2.5만회씩 붙고 있다. 그래서: 프랜차이즈·자산 세습 주제는 후속편 후보로 우선 배치한다.", "channel": "인스타그램", "title": "#12·#06 장기 확산 지속"}, {"body": "#13 2.8만→3.1만회, 새 팔로워 206명, 계정 팔로워 3.5K→3.6K. #14는 336회, 평균 시청 40초·완주율 6.9%로 #13(57.7초·9.8%)보다 낮다. 그래서: 틱톡은 #13처럼 첫 문장에 기업명·숫자를 넣은 버전의 반응을 기준으로 삼는다.", "channel": "틱톡", "title": "#13 3일차에도 성장, #14는 완주율 낮음"}, {"body": "하루 새 +146명. #12 페이스북 조회가 23,819→42,356회(+18,537)로 급증한 영향이 큰 것으로 보인다(10/11 업로드분은 내부 검토로 내렸다가 재업로드 예정, 일시 노출 영향이 섞였을 수 있음). 그래서: 내일도 팔로워가 유지되는지 확인하고, 유지되면 #12형 주제를 페이스북에 먼저 배치한다.", "channel": "페이스북", "title": "페이지 팔로워 115→261"}]}, "2026-10-14": {"date": "2026-10-14", "items": [{"body": "같은 15시간 기준으로 #15는 유튜브 1,133회(#14 246회), 쓰레드 861회(#14 453회), 페이스북 631회(#14 377회)로 앞섰고, 인스타는 4,994회(#14 7,538회)로 뒤처졌습니다. #15는 10/11 업로드분을 다듬어 다시 올린 영상입니다. 그래서: 인스타는 첫 화면 문구를 바꾼 버전을 스토리로 한 번 더 노출해 초반 반응을 끌어올립니다.", "channel": "공통", "title": "#15 게시 15시간: 유튜브·쓰레드는 #14보다 빠르고 인스타는 느림"}, {"body": "하루 동안 #06 +22,721회(누적 73.4만), #12 +5,318회(21.6만), #07 +4,872회로 세 영상이 인스타 증가분의 약 70%를 차지했습니다. #15는 비팔로워 조회 비율이 43%로 #14(64%), #13(84%)보다 낮아 아직 추천 확산 전 단계입니다. 그래서: #06·#12의 '숫자로 여는 첫 문장' 구조를 다음 원고 도입부에 그대로 적용합니다.", "channel": "인스타그램", "title": "#06·#12가 하루 증가분의 대부분"}, {"body": "#12는 페이스북에서 47,593회(전일 42,356회)로 늘었고 조회의 99%가 팔로워가 아닌 사람에게서 나왔습니다. 페이지 팔로워는 261명에서 299명으로 늘었고, 다른 영상은 하루 6~23회 증가에 그쳤습니다. 그래서: #12처럼 생활 소비 소재(커피·배달 등) 영상은 페이스북 캡션 첫 줄에 질문형 문장을 넣어 같은 흐름을 노립니다.", "channel": "페이스북", "title": "#12 페이스북 릴스가 하루 +5,237회, 페이지 팔로워 +38"}, {"body": "#14는 1,102회(전일 246회)로 Shorts 피드 비중 91.2%, 계속 시청 65.9%를 기록했습니다. #15는 15시간 만에 1,133회로 노출은 빠르지만 계속 시청 비율이 48.6%로 최근 영상 중 가장 낮습니다. 구독자는 285명에서 301명으로 늘었습니다. 그래서: 다음 영상은 첫 2초에 결론 숫자를 먼저 보여 줘 이탈을 줄입니다.", "channel": "유튜브", "title": "#14 하루 +856회, #15는 Shorts 피드 95%지만 계속 시청 48.6%"}, {"body": "#13은 32K로 꾸준히 늘었지만 #14는 3   if(!cur) return;
  const day=days[dayIdx(cur)]||{};
  $("#collected").textContent=`${cur} 기준 · 수집 ${day.collectedAt||"—"} · 증감은 전일 수집 대비`;
  renderTabs();
  const c=CH[tab];
  if(c.weekly){ $("#view").innerHTML=`<div class="card"><div class="acct"><div><div class="name">${c.name}</div><div class="handle">${esc(c.handle)}</div></div></div><p class="note" style="margin:0">네이버는 브라우저 자동 수집이 막혀 있어 통계 캡처를 받아 수동으로 합산합니다.</p><div class="links"><a class="link" href="https://m.blog.naver.com/ahntax_insight" target="_blank" rel="noopener">블로그 열기 ↗</a><a class="link" href="https://clip.naver.com/@ahntax_insight" target="_blank" rel="noopener">클립 열기 ↗</a></div></div>${naverBlock(day)}${fbBlock()}`; return; }

  const acct=(day.accounts||{})[tab]||{};
  const prevAcct=(()=>{const i=dayIdx(cur); for(let j=i-1;j>=0;j--){const a=(days[j].accounts||{})[tab]; if(a) return a;} return null;})();
  const vids=Object.entries(videos).filter(([id])=>snapAt(cur,id,tab)).sort((a,b)=>(b[1].uploaded||"").localeCompare(a[1].uploaded||"")||b[0].localeCompare(a[0]));
  // channel deltas across all videos (delta only for videos collected that day; cumulative carries forward)
  const tot={}, cum={};
  for(const [id] of vids){const at=snapAt(cur,id,tab).s, s=snap(cur,id,tab), p=prevSnap(cur,id,tab); for(const [k] of c.fields){if(at?.[k]!=null) cum[k]=(cum[k]||0)+(Number(at[k])||0); const dv=s?delta(s,p,k):null; if(dv!=null) tot[k]=(tot[k]||0)+dv;}}
  const latest=vids[0];
  const lv=latest?{...snapAt(cur,latest[0],tab).s,_len:latest[1].lengthSec}:null;

  const acctDelta=acct.followers!=null&&prevAcct?.followers!=null?acct.followers-prevAcct.followers:null;
  let html=`<div class="card">
    <div class="acct"><div><div class="name">${c.name}</div><div class="handle">${esc(c.handle)}</div></div><a class="link" href="${esc(c.url)}" target="_blank" rel="noopener">채널 열기 ↗</a></div>
    <div class="acct-stats"><div><span class="lbl">${c.acct[1]}</span><b>${fmt(acct.followers)}</b><span class="dlt num" style="font-size:11px;color:var(--up)">${acctDelta==null?"전일 데이터 없음":dStr(acctDelta)}</span></div><div><span class="lbl">추적 중인 영상</span><b>${vids.length}</b></div></div>
    ${acct.note?`<p class="note" style="margin:0">${esc(acct.note)}</p>`:""}
  </div>`;

  html+=`<div class="card"><div class="card-h"><h2>오늘 증가분</h2><span class="hint">전 영상 합산 · 아래 작은 숫자는 누적</span></div>
    <div class="metrics">${c.fields.map(([k,l])=>`<div class="m"><span class="t">${l}</span><span class="v">${tot[k]==null?"—":fmt(tot[k])}</span><span class="dlt zero">누적 ${cum[k]==null?"—":fmt(cum[k])}</span></div>`).join("")}</div></div>`;

  if(lv) html+=`<div class="card"><div class="card-h"><h2>알고리즘 핵심 신호</h2><span class="hint">최신 영상 ${esc(latest[1].no)} 기준</span></div>
    <div class="sig">${c.signals(lv).map(([k,v,w])=>`<div class="s"><span class="k">${k}</span><span class="v">${v}</span><span class="w">${w}</span></div>`).join("")}</div>${lv.note?`<p class="note" style="margin:0">${esc(lv.note)}</p>`:""}</div>`;

  if(lv) html+=`<div class="card"><div class="card-h"><h2>시청자 타겟</h2><span class="hint">최신 영상 ${esc(latest[1].no)} 기준</span></div>${audienceBlock(lv.audience)}</div>`;

  html+=`<div class="card chart"><div class="card-h"><h2>일별 조회 증가</h2><span class="hint">${c.name} · 전 영상 합산</span></div>${trend()}</div>`;

  const shown=showAll?vids:vids.slice(0,5);
  html+=`<div class="card-h" style="padding:6px 2px 0"><h2>영상별 성과</h2><span class="hint">최신순 · ${vids.length}개</span></div>`;
  html+= vids.length? shown.map(([id,v])=>videoCard(id,v)).join("") : `<div class="card empty">${cur} 기준 수집된 영상이 없습니다.</div>`;
  if(vids.length>5&&!showAll) html+=`<button class="more" id="more">이전 영상 ${vids.length-5}개 더 보기</button>`;
  html+=fbBlock();
  $("#view").innerHTML=html;
  $("#more")?.addEventListener("click",()=>{showAll=true;render();});
}

function naverBlock(day){
  let d=day, i=dayIdx(cur); while(i>=0 && !(days[i].naverWeekly)) i--; if(i<0) return `<div class="card empty">아직 받은 네이버 통계가 없습니다.</div>`;
  d=days[i]; const w=d.naverWeekly.clip||{};
  const rows=Object.entries(videos).filter(([id])=>(d.metrics||{})[id]?.naverclip).sort((a,b)=>(b[1].uploaded||"").localeCompare(a[1].uploaded||""));
  const age=Object.entries(w.age||{});
  const mx=Math.max(1,...age.map(a=>a[1]||0));
  return `<div class="card"><div class="card-h"><h2>네이버 클립 · 최근 7일</h2><span class="hint">${esc(w.period||"")} · ${esc(d.date)} 반영</span></div>
  <div class="metrics">
   <div class="m"><span class="t">조회수</span><span class="v">${fmt(w.views)}</span></div>
   <div class="m"><span class="t">순 시청자</span><span class="v">${fmt(w.uniqueViewers)}</span></div>
   <div class="m"><span class="t">노출</span><span class="v">${fmt(w.impressions)}</span></div>
   <div class="m"><span class="t">클릭</span><span class="v">${fmt(w.clicks)}</span></div>
   <div class="m"><span class="t">좋아요</span><span class="v">${fmt(w.likes)}</span></div>
   <div class="m"><span class="t">팔로워</span><span class="v">${fmt(w.followers)}</span></div>
  </div>
  <div class="aud-g"><span class="lbl">유입처</span><span class="note">${esc(w.traffic||"—")}</span></div>
  <div class="aud-g"><span class="lbl">성별</span><div class="split"><div class="sp-a" style="width:${w.male||0}%"></div><div class="sp-b"></div></div><div class="split-l"><span>남성 ${w.male??"—"}%</span><span>여성 ${w.female??"—"}%</span></div></div>
  ${age.length?`<div class="aud-g"><span class="lbl">연령 (근사치)</span><div class="bars">${age.map(([k,v])=>`<div class="bar-row"><span class="lab">${esc(k)}</span><div class="track"><div class="fill" style="width:${(v||0)/mx*100}%"></div></div><span class="val">${v}%</span></div>`).join("")}</div></div>`:""}
  ${w.note?`<p class="note" style="margin:0">${esc(w.note)}</p>`:""}</div>
  <div class="card"><div class="card-h"><h2>영상별 누적 (클립)</h2><span class="hint">${esc(d.date)} 기준</span></div>
  <div class="tbl"><table><thead><tr><th>영상</th><th>업로드</th><th>조회</th><th>좋아요</th></tr></thead><tbody>
  ${rows.map(([id,v])=>{const m=d.metrics[id].naverclip; return `<tr><td>${esc(v.no)} ${esc((v.title||"").slice(0,22))}</td><td>${esc((v.uploaded||"").slice(5))}</td><td>${fmt(m.views)}</td><td>${fmt(m.likes)}</td></tr>`}).join("")}
  </tbody></table></div><p class="note" style="margin:0">블로그 통계는 아직 받지 않았습니다.</p></div>`;
}
function fbBlock(){
  const f=feedback[cur]; if(!f||!(f.items||[]).length) return "";
  return `<div class="card fb"><details><summary>콘텐츠 피드백 · ${esc(cur)}</summary>
    <div class="fb-list">${f.items.map(x=>`<div class="fb-i"><span class="fb-ch">${esc(x.channel||"공통")}</span><b>${esc(x.title)}</b><p>${esc(x.body)}</p></div>`).join("")}</div></details></div>`;
}

function audienceBlock(a){
  if(!a) return `<div class="empty">타겟 데이터가 아직 없습니다</div>`;
  const row=(l,v,max)=>`<div class="bar-row"><span class="lab">${esc(l)}</span><div class="track"><div class="fill" style="width:${v==null?0:Math.min(100,v/(max||100)*100)}%"></div></div><span class="val">${v==null?"—":v+"%"}</span></div>`;
  const fTot=(a.followerViews||0)+(a.nonFollowerViews||0);
  const fPct=fTot?+(a.followerViews/fTot*100).toFixed(1):null;
  const ages=a.age?Object.entries(a.age):[];
  const aMax=Math.max(1,...ages.map(([,v])=>v));
  let h=`<div class="aud">`;
  const NA=`<span class="na">${esc(a.naReason||"제공 안 됨")}</span>`;
  if(!fTot&&a.subWatch&&a.subWatch.sub!=null){const sp=a.subWatch.sub;h+=`<div class="aud-g"><span class="lbl">구독 여부 · 시청 시간 기준</span><div class="split"><div style="width:${sp}%" class="sp-a"></div><div class="sp-b"></div></div><div class="split-l"><span>구독 중 ${sp}%</span><span>구독 안 함 ${a.subWatch.nonsub}%</span></div></div>`;} else
  h+=`<div class="aud-g"><span class="lbl">팔로워 여부</span>${fTot?`<div class="split"><div style="width:${fPct}%" class="sp-a"></div><div class="sp-b"></div></div><div class="split-l"><span>팔로워 ${fmt(a.followerViews)} (${fPct}%)</span><span>비팔로워 ${fmt(a.nonFollowerViews)} (${(100-fPct).toFixed(1)}%)</span></div>`:NA}</div>`;
  h+=`<div class="aud-g"><span class="lbl">성별</span>${a.male!=null?`<div class="split"><div style="width:${a.male}%" class="sp-a"></div><div class="sp-b"></div></div><div class="split-l"><span>남성 ${a.male}%</span><span>여성 ${a.female}%${a.other?` · 기타 ${a.other}%`:""}</span></div>`:NA}</div>`;
  h+=`<div class="aud-g"><span class="lbl">연령</span>${ages.length?`<div class="bars">${ages.map(([k,v])=>row(k,v,aMax)).join("")}</div>`:NA}</div>`;
  h+=`<div class="aud-g"><span class="lbl">국가</span>${(a.countries||[]).length?`<div class="bars">${a.countries.map(c=>row(c.name,c.pct,100)).join("")}</div>`:NA}</div>`;
  h+=`<div class="aud-g"><span class="lbl">관심사</span>${(a.interests||[]).length?`<div class="chips">${a.interests.map(x=>`<span class="ic">${esc(x)}</span>`).join("")}</div>`:NA}</div>`;
  if(a.note) h+=`<p class="note" style="margin:0">${esc(a.note)}</p>`;
  return h+`</div>`;
}

function history(id,v){
  const c=CH[tab], keys=["views","likes","comments","saves","shares","reposts","follows"].filter(k=>c.fields.some(([f])=>f===k));
  const lab=Object.fromEntries(c.fields);
  const rows=[]; let prev=null;
  for(const d of days){ if(d.date>cur) break; const s=(d.metrics||{})[id]?.[tab]; if(!s) continue;
    const dp=v.uploaded?Math.round((new Date(d.date)-new Date(v.uploaded))/864e5):"";
    rows.push(`<tr><td>${d.date.slice(5)}<span class="sub">D+${dp}</span></td>${keys.map(k=>{const dv=s[k]==null?null:(Number(s[k])||0)-(Number(prev?.[k])||0);return `<td>${fmt(s[k])}<span class="sub">${dv==null?"":dStr(dv)}</span></td>`}).join("")}</tr>`); prev=s; }
  if(!rows.length) return `<div class="empty">기록 없음</div>`;
  return `<div class="tbl"><table><thead><tr><th>날짜</th>${keys.map(k=>`<th>${lab[k]}</th>`).join("")}</tr></thead><tbody>${rows.reverse().join("")}</tbody></table></div><p class="note" style="margin:6px 0 0">위 숫자 누적 · 아래 숫자 직전 수집 대비 증가</p>`;
}

function videoCard(id,v){
  const c=CH[tab], at=snapAt(cur,id,tab), s=at?.s, ex=snap(cur,id,tab), p=prevSnap(cur,id,tab);
  const dPlus=v.uploaded?Math.round((new Date(cur)-new Date(v.uploaded))/864e5):null;
  const stale=at&&at.date!==cur;
  const cm=((comments[id]||{})[tab])||[];
  const post=(v.posts||{})[tab];
  return `<article class="card video">
    <div class="v-h"><div><div class="v-no">${esc(v.no)}${dPlus===0||dPlus===1?'<span class="pill">NEW</span>':""}${stale?'<span class="pill wk">주간 갱신</span>':""}</div><div class="v-title">${esc(v.title)}</div></div>
      ${post?`<a class="link" href="${esc(post)}" target="_blank" rel="noopener">게시물 ↗</a>`:""}
      <div class="v-meta">업로드 ${esc(v.uploaded)} · D+${dPlus??"—"} · ${esc(v.length||"")}${stale?` · 마지막 수집 ${esc(at.date)}`:""}</div></div>
    <div class="metrics">${c.fields.map(([k,l])=>{const dv=ex?delta(ex,p,k):null;return `<div class="m"><span class="t">${l}</span><span class="v">${fmt(s?.[k])}</span><span class="dlt ${dv?"":"zero"}">${dv==null?"":"오늘 "+dStr(dv)}</span></div>`}).join("")}</div>
    <details><summary>일자별 추이</summary><div style="margin-top:10px">${history(id,v)}</div></details>
    <details class="aud-d"><summary>타겟 상세</summary><div style="margin-top:10px">${audienceBlock(s?.audience)}</div></details>
    <details open><summary>댓글 ${fmt(s?.comments??cm.length)}건 · 수집 ${cm.length}건</summary>
      <div class="cmts">${cm.length?cm.map(x=>`<div class="c${x.reply?" reply":""}"><span class="u"><b>${esc(x.user)}</b> · ${esc(x.ago||"")}${x.likes?` · 좋아요 ${fmt(x.likes)}`:""}</span><span class="x">${esc(x.text)}</span></div>`).join(""):`<div class="empty">${esc(((comments[id]||{}).notes||{})[tab]||"수집된 댓글이 없습니다")}</div>`}</div>
    </details>
  </article>`;
}

function trend(){
  const pts=days.map(d=>{let s=0,any=false; for(const vid in (d.metrics||{})){const x=d.metrics[vid][tab]; if(x){any=true; s+=delta(x,prevSnap(d.date,vid,tab),"views")||0;}} return any?{d:d.date,v:s}:null}).filter(Boolean);
  if(pts.length<2) return `<div class="empty">2일 이상 쌓이면 추이가 표시됩니다 (현재 ${pts.length}일)</div>`;
  const view=pts.slice(-14), W=640,H=180,L=44,R=8,T=18,B=26, max=Math.max(1,...view.map(p=>p.v))*1.15;
  const bw=(W-L-R)/view.length, y=v=>T+(H-T-B)*(1-v/max);
  const ticks=[0,Math.round(max/2),Math.round(max)];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="일별 조회 증가">
    ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-num)">${fmt(t)}</text>`).join("")}
    ${view.map((p,i)=>{const x=L+i*bw+bw*.2,w=bw*.6,h=Math.max(1,y(0)-y(p.v));return `<rect x="${x}" y="${y(0)-h}" width="${w}" height="${h}" rx="3" fill="${p.d===cur?"var(--accent)":"var(--bar)"}"><title>${p.d} · ${fmt(p.v)}</title></rect><text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="var(--f-num)">${p.d.slice(5)}</text>${p.d===cur?`<text x="${x+w/2}" y="${y(p.v)-5}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--fg)" font-family="var(--f-num)">${fmt(p.v)}</text>`:""}`}).join("")}
  </svg>`;
}

$("#tabs").addEventListener("click",e=>{const b=e.target.closest(".tab"); if(!b) return; tab=b.dataset.k; showAll=false; try{localStorage.setItem("ai-tab",tab)}catch{} render(); window.scrollTo({top:0});});
$("#date-pick").addEventListener("change",e=>{cur=e.target.value; render();});

function fillDates(){
  const sel=$("#date-pick"), sorted=days.map(d=>d.date).sort().reverse();
  if(!cur||!sorted.includes(cur)) cur=sorted[0];
  sel.innerHTML=sorted.map(d=>`<option value="${d}">${d}</option>`).join(""); sel.value=cur;
}

function applySeed(){
  try{
    const s=JSON.parse(document.getElementById("seed").textContent||"{}");
    videos=s.videos||{}; comments=s.comments||{}; feedback=s.feedback||{};
    days=(s.daily||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
    if(days.length){fillDates(); render();}
  }catch{}
}
applySeed();

(async()=>{
  const db=await window.claude?.use?.("db");
  if(!db) return; // 공개 링크 등: 페이지에 담긴 데이터로 표시
  const quiet=()=>{};
  db.collection("videos").onSnapshot(s=>{if(s.empty) return; videos={}; s.docs.forEach(d=>d.exists&&(videos[d.id]=d.data())); render();},quiet);
  db.collection("comments").onSnapshot(s=>{if(s.empty) return; comments={}; s.docs.forEach(d=>d.exists&&(comments[d.id]=d.data())); render();},quiet);
  db.collection("feedback").onSnapshot(s=>{if(s.empty) return; feedback={}; s.docs.forEach(d=>d.exists&&(feedback[d.data().date||d.id]=d.data())); render();},quiet);
  db.collection("daily").onSnapshot(s=>{if(s.empty) return; days=s.docs.filter(d=>d.exists).map(d=>({...d.data(),date:d.data().date||d.id})).sort((a,b)=>a.date.localeCompare(b.date)); fillDates(); render();},quiet);
})();
</script>

</body></html>
